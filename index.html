<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超極致靈敏音頻事件檢測器 v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
            min-height: 100vh;
            padding: 15px;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .current-file-display {
            background: rgba(0, 212, 255, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            font-size: 14px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        
        .current-file-display .file-icon {
            font-size: 20px;
        }
        
        .current-file-display .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .file-manager {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .file-tab {
            background: rgba(255,255,255,0.05);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-tab:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .file-tab.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: #00d4ff;
            color: #00d4ff;
        }
        
        .file-tab .event-badge {
            background: #ff4081;
            color: white;
            border-radius: 50%;
            padding: 0 6px;
            font-size: 10px;
            margin-left: 5px;
        }
        
        .upload-section {
            border: 2px dashed rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.03);
        }
        
        .upload-section input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin: 10px 0;
            border-left: 3px solid #00d4ff;
        }
        
        .status-text {
            color: #aaa;
            font-size: 13px;
        }
        
        .status-text.success { color: #69f0ae; }
        .status-text.warning { color: #ffd740; }
        .status-text.danger { color: #ff5252; }
        .status-text.info { color: #40c4ff; }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
            padding: 18px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .controls label {
            font-weight: 600;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        
        .controls input[type="range"] {
            width: 100px;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        
        .controls input[type="number"] {
            width: 65px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 13px;
        }
        
        .controls select {
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #7b2ffc); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 25px rgba(0, 212, 255, 0.2); }
        .btn-success { background: #00c853; color: white; }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: #ff1744; color: white; }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-warning { background: #ff9100; color: #333; }
        .btn-warning:hover { transform: translateY(-2px); }
        .btn-info { background: #2979ff; color: white; }
        .btn-info:hover { transform: translateY(-2px); }
        .btn-pulse { background: linear-gradient(135deg, #ff4081, #f50057); color: white; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .stat-card .number {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
        }
        
        .stat-card .label {
            color: #888;
            font-size: 11px;
            margin-top: 3px;
        }
        
        .waveform-container {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            position: relative;
            min-height: 200px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        #waveform {
            width: 100%;
            height: 200px;
        }
        
        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        
        .event-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .event-card:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .event-card.active {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
        }
        
        .event-card .event-number {
            font-weight: 700;
            color: #00d4ff;
            font-size: 14px;
        }
        
        .event-card .event-time {
            color: #999;
            font-size: 12px;
            margin: 2px 0;
        }
        
        .event-card .event-duration {
            color: #69f0ae;
            font-weight: 600;
            font-size: 13px;
        }
        
        .event-card .event-features {
            display: flex;
            gap: 6px;
            margin: 6px 0;
            flex-wrap: wrap;
        }
        
        .event-card .feature-tag {
            background: rgba(0, 212, 255, 0.08);
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 10px;
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.05);
        }
        
        .event-card .btn-group {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        
        .event-card .btn-group .btn {
            flex: 1;
            min-width: 45px;
            padding: 4px 8px;
            font-size: 11px;
        }
        
        .player-container {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 18px;
            margin: 15px 0;
            display: none;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        
        .player-container.active {
            display: block;
        }
        
        .player-container audio {
            width: 100%;
            margin: 8px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            transition: width 0.1s;
            width: 0%;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 25px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.05);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .color-tag {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .export-section {
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .file-list-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a3e;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            max-width: 500px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        
        .file-list-popup.active {
            display: block;
        }
        
        .file-list-popup .file-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-list-popup .file-item:hover {
            background: rgba(255,255,255,0.03);
        }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .overlay.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; }
            .current-file-display { max-width: 100%; }
            .controls { flex-direction: column; align-items: stretch; }
            .event-list { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .file-manager { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部標題與檔案顯示 -->
        <div class="header">
            <h1>🔊 超極致靈敏音頻檢測器 v2.0</h1>
            <div class="current-file-display" id="currentFileDisplay">
                <span class="file-icon">📁</span>
                <span class="file-name" id="currentFileName">尚未載入檔案</span>
                <span id="fileEventCount" style="color: #ff4081; font-size: 12px;"></span>
            </div>
        </div>
        
        <!-- 檔案管理 -->
        <div class="file-manager" id="fileManager">
            <span style="font-size: 12px; color: #888;">已載入檔案：</span>
            <div id="fileTabs" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>
            <button class="btn btn-info" onclick="showFileList()" style="padding: 4px 12px; font-size: 12px;">📋 所有檔案</button>
        </div>
        
        <!-- 上傳區域 -->
        <div class="upload-section">
            <div style="font-size: 36px; margin-bottom: 8px;">🎵</div>
            <h3 style="color: #fff; font-size: 18px;">上傳音頻檔案</h3>
            <p style="color: #888; margin: 8px 0; font-size: 13px;">支援 WAV, MP3, FLAC, M4A, OGG, AAC, WMA</p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📂 選擇音頻檔案 (可多選)
            </button>
            <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.m4a,.ogg,.aac,.wma" multiple>
            <p id="uploadStatus" style="color: #69f0ae; margin-top: 8px; font-size: 13px;"></p>
        </div>
        
        <!-- 狀態欄 -->
        <div class="status-bar">
            <span class="status-text" id="statusText">🎯 等待上傳音頻...</span>
            <span class="status-text" id="fileInfo"></span>
        </div>
        
        <!-- 控制面板 -->
        <div class="controls">
            <label>
                🔥 靈敏度
                <input type="range" id="sensitivity" min="0.01" max="5" step="0.01" value="0.05">
                <span id="sensitivityValue" style="min-width: 35px; color: #00d4ff;">0.05</span>
            </label>
            <label>
                ⏱️ 最短事件 (秒)
                <input type="number" id="minDuration" value="0.01" step="0.001" min="0.001" max="0.5">
            </label>
            <label>
                📊 檢測模式
                <select id="detectMode">
                    <option value="all">全部 (最敏感)</option>
                    <option value="energy">音量變化</option>
                    <option value="spectral">頻率變化</option>
                    <option value="onset">節奏變化</option>
                    <option value="timbre">音色變化</option>
                </select>
            </label>
            <button class="btn btn-pulse" onclick="ultraSensitiveDetect()">⚡ 極致檢測</button>
            <button class="btn btn-primary" onclick="detectEvents()">🔍 標準檢測</button>
            <button class="btn btn-success" onclick="exportAllEvents()">💾 導出全部</button>
            <button class="btn btn-danger" onclick="clearCurrentFile()">🗑️ 清除</button>
        </div>
        
        <!-- 統計 -->
        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card"><div class="number" id="statEvents">0</div><div class="label">事件數</div></div>
            <div class="stat-card"><div class="number" id="statAvgDuration">0s</div><div class="label">平均時長</div></div>
            <div class="stat-card"><div class="number" id="statCoverage">0%</div><div class="label">聲音覆蓋率</div></div>
            <div class="stat-card"><div class="number" id="statMaxDuration">0s</div><div class="label">最長事件</div></div>
            <div class="stat-card"><div class="number" id="statMinDuration">0s</div><div class="label">最短事件</div></div>
        </div>
        
        <!-- 載入動畫 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 12px; color: #888; font-size: 14px;">🔬 正在進行超精細音頻分析...</p>
        </div>
        
        <!-- 波形 -->
        <div class="waveform-container">
            <canvas id="waveform"></canvas>
        </div>
        
        <!-- 播放器 -->
        <div class="player-container" id="playerContainer">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong id="playerTitle" style="color: #00d4ff; font-size: 14px;">🎧 播放事件</strong>
                <button class="btn btn-danger" onclick="closePlayer()" style="padding: 4px 12px; font-size: 12px;">✕</button>
            </div>
            <audio id="audioPlayer" controls style="width: 100%; margin: 8px 0;"></audio>
            <div class="progress-bar"><div class="progress" id="playProgress"></div></div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="playPrevious()">⏮ 上一個</button>
                <button class="btn btn-primary" onclick="playNext()">⏭ 下一個</button>
                <button class="btn btn-info" onclick="playAllEvents()">▶▶ 全部播放</button>
            </div>
        </div>
        
        <!-- 事件列表 -->
        <div style="margin-top: 15px;">
            <h3 style="color: #fff; font-size: 16px;">📋 檢測到的事件 <span id="eventCount" style="color: #00d4ff;">(0)</span></h3>
            <div id="eventList" class="event-list"></div>
        </div>
        
        <!-- 導出區域 -->
        <div class="export-section" id="exportSection" style="display: none;">
            <h4 style="color: #ccc; font-size: 14px;">📦 導出選項</h4>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
                <button class="btn btn-success" onclick="exportTimeline()">📄 時間線</button>
                <button class="btn btn-success" onclick="exportAllEvents()">🎵 所有事件音頻</button>
                <button class="btn btn-warning" onclick="exportReport()">📊 分析報告</button>
                <button class="btn btn-info" onclick="exportAllFilesReport()">📋 所有檔案報告</button>
            </div>
            <div id="exportResult" style="margin-top: 8px; color: #69f0ae; font-size: 13px;"></div>
        </div>
        
        <div style="margin-top: 15px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; border-left: 3px solid #ffd740;">
            <strong style="color: #ffd740; font-size: 13px;">💡 超極致靈敏模式：</strong>
            <span style="color: #aaa; font-size: 12px;">
                靈敏度可低至 0.01，最短事件可達 0.001 秒。可同時檢測音量、頻率、節奏、音色變化。
                支援多檔案同時載入與管理，每個檔案獨立保存檢測結果。
            </span>
        </div>
    </div>
    
    <!-- 檔案列表彈窗 -->
    <div class="overlay" id="overlay" onclick="closeFileList()"></div>
    <div class="file-list-popup" id="fileListPopup">
        <h3 style="color: #00d4ff; margin-bottom: 15px;">📋 所有已載入檔案</h3>
        <div id="fileListContent"></div>
        <button class="btn btn-danger" onclick="closeFileList()" style="margin-top: 15px; width: 100%;">關閉</button>
    </div>
    
    <script>
        // ==================== 全局變數 ====================
        const fileStore = {}; // { fileName: { audioData, sampleRate, duration, events, name } }
        let currentFile = null;
        let audioContext = null;
        let audioBuffer = null;
        let audioData = null;
        let sampleRate = 22050;
        let events = [];
        let currentEventIndex = -1;
        let allEventsPlaying = false;
        
        // 顏色配置
        const eventColors = [
            '#00d4ff', '#7b2ffc', '#ff4081', '#69f0ae', '#ffd740',
            '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#dda0dd',
            '#ff9a76', '#f7dc6f', '#bb8fce', '#85c1e9', '#f1948a',
            '#ff5252', '#448aff', '#ffab40', '#00e676', '#ea80fc'
        ];
        
        // DOM 引用
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const statusText = document.getElementById('statusText');
        const fileInfo = document.getElementById('fileInfo');
        const eventList = document.getElementById('eventList');
        const eventCount = document.getElementById('eventCount');
        const loading = document.getElementById('loading');
        const playerContainer = document.getElementById('playerContainer');
        const audioPlayerEl = document.getElementById('audioPlayer');
        const playProgress = document.getElementById('playProgress');
        const playerTitle = document.getElementById('playerTitle');
        const sensitivity = document.getElementById('sensitivity');
        const sensitivityValue = document.getElementById('sensitivityValue');
        const minDuration = document.getElementById('minDuration');
        const exportSection = document.getElementById('exportSection');
        const exportResult = document.getElementById('exportResult');
        const canvas = document.getElementById('waveform');
        const statsGrid = document.getElementById('statsGrid');
        const currentFileName = document.getElementById('currentFileName');
        const fileEventCount = document.getElementById('fileEventCount');
        const fileTabs = document.getElementById('fileTabs');
        
        // ==================== 事件監聽 ====================
        sensitivity.addEventListener('input', function() {
            sensitivityValue.textContent = this.value;
        });
        
        fileInput.addEventListener('change', function(e) {
            const files = this.files;
            if (files.length > 0) {
                uploadStatus.textContent = `⏳ 正在載入 ${files.length} 個檔案...`;
                let loaded = 0;
                for (const file of files) {
                    loadAudioFile(file, () => {
                        loaded++;
                        uploadStatus.textContent = `✅ 已載入 ${loaded}/${files.length} 個檔案`;
                        if (loaded === files.length) {
                            uploadStatus.textContent = `✅ 成功載入 ${files.length} 個檔案！`;
                            updateFileTabs();
                        }
                    });
                }
            }
        });
        
        // ==================== 音頻載入 ====================
        function loadAudioFile(file, callback) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    
                    const arrayBuffer = e.target.result;
                    const buffer = await audioContext.decodeAudioData(arrayBuffer);
                    const data = buffer.getChannelData(0);
                    const sr = buffer.sampleRate;
                    const duration = buffer.duration;
                    
                    // 儲存檔案
                    const fileName = file.name;
                    fileStore[fileName] = {
                        audioData: data,
                        sampleRate: sr,
                        duration: duration,
                        events: [],
                        name: fileName,
                        fileSize: file.size,
                        loaded: true
                    };
                    
                    // 如果是第一個檔案，自動設為當前
                    if (!currentFile) {
                        currentFile = fileName;
                        setCurrentFile(fileName);
                    }
                    
                    if (callback) callback();
                    
                } catch (error) {
                    console.error('載入失敗:', error);
                    uploadStatus.textContent = `❌ 載入 ${file.name} 失敗: ${error.message}`;
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // ==================== 設定當前檔案 ====================
        function setCurrentFile(fileName) {
            if (!fileStore[fileName]) return;
            
            currentFile = fileName;
            const data = fileStore[fileName];
            audioData = data.audioData;
            sampleRate = data.sampleRate;
            events = data.events || [];
            
            // 更新顯示
            currentFileName.textContent = fileName;
            fileEventCount.textContent = events.length > 0 ? `(${events.length} 個事件)` : '';
            
            // 更新波形
            drawWaveform(audioData, sampleRate);
            renderEvents();
            updateStats();
            
            statusText.textContent = `📁 當前檔案: ${fileName}`;
            statusText.className = 'status-text info';
            fileInfo.textContent = `⏱️ ${data.duration.toFixed(2)}秒 | 📊 ${sampleRate} Hz`;
            
            // 更新檔案標籤
            updateFileTabs();
            
            // 如果沒有事件，自動檢測
            if (events.length === 0) {
                setTimeout(() => ultraSensitiveDetect(), 200);
            }
        }
        
        // ==================== 更新檔案標籤 ====================
        function updateFileTabs() {
            const fileNames = Object.keys(fileStore);
            if (fileNames.length === 0) {
                fileTabs.innerHTML = '<span style="color: #666; font-size: 12px;">尚無檔案</span>';
                return;
            }
            
            fileTabs.innerHTML = fileNames.map(name => {
                const eventCount = fileStore[name].events ? fileStore[name].events.length : 0;
                const isActive = name === currentFile;
                return `<div class="file-tab ${isActive ? 'active' : ''}" onclick="switchFile('${name}')">
                    ${name.length > 15 ? name.substring(0, 12) + '...' : name}
                    ${eventCount > 0 ? `<span class="event-badge">${eventCount}</span>` : ''}
                </div>`;
            }).join('');
        }
        
        // ==================== 切換檔案 ====================
        function switchFile(fileName) {
            if (fileStore[fileName]) {
                setCurrentFile(fileName);
                closeFileList();
            }
        }
        
        // ==================== 顯示檔案列表 ====================
        function showFileList() {
            const content = document.getElementById('fileListContent');
            const fileNames = Object.keys(fileStore);
            
            if (fileNames.length === 0) {
                content.innerHTML = '<p style="color: #666;">尚無已載入的檔案</p>';
            } else {
                content.innerHTML = fileNames.map(name => {
                    const data = fileStore[name];
                    const count = data.events ? data.events.length : 0;
                    return `<div class="file-item" onclick="switchFile('${name}')">
                        <span>${name}</span>
                        <span style="color: #00d4ff; font-size: 12px;">${count} 個事件</span>
                    </div>`;
                }).join('');
            }
            
            document.getElementById('fileListPopup').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }
        
        function closeFileList() {
            document.getElementById('fileListPopup').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }
        
        // ==================== 極致檢測 ====================
        function ultraSensitiveDetect() {
            if (!audioData) {
                statusText.textContent = '❌ 請先載入音頻檔案';
                statusText.className = 'status-text danger';
                return;
            }
            
            loading.classList.add('active');
            statusText.textContent = '🔬 正在進行超極致靈敏檢測 (0.01秒精度)...';
            statusText.className = 'status-text';
            
            setTimeout(() => {
                try {
                    const thresholdMultiplier = parseFloat(sensitivity.value);
                    const minDur = Math.max(0.001, parseFloat(minDuration.value));
                    const mode = document.getElementById('detectMode').value;
                    
                    // 提取多種特徵 (更高解析度)
                    const features = extractHighResFeatures(audioData, sampleRate);
                    
                    let allDetections = [];
                    
                    // 所有特徵檢測
                    const energyDetections = detectByFeature(features.energy, thresholdMultiplier * 0.6, minDur, sampleRate, features.times);
                    const spectralDetections = detectByFeature(features.spectral, thresholdMultiplier * 0.5, minDur, sampleRate, features.times);
                    const onsetDetections = detectByFeature(features.onset, thresholdMultiplier * 0.4, minDur * 0.5, sampleRate, features.times);
                    const timbreDetections = detectByFeature(features.timbre, thresholdMultiplier * 0.7, minDur, sampleRate, features.times);
                    
                    // 根據模式選擇
                    if (mode === 'all') {
                        allDetections = [...energyDetections, ...spectralDetections, ...onsetDetections, ...timbreDetections];
                    } else if (mode === 'energy') {
                        allDetections = energyDetections;
                    } else if (mode === 'spectral') {
                        allDetections = spectralDetections;
                    } else if (mode === 'onset') {
                        allDetections = onsetDetections;
                    } else if (mode === 'timbre') {
                        allDetections = timbreDetections;
                    }
                    
                    // 合併重疊事件 (更精細的合併)
                    allDetections.sort((a, b) => a[0] - b[0]);
                    const mergedEvents = [];
                    for (const evt of allDetections) {
                        if (mergedEvents.length === 0 || evt[0] > mergedEvents[mergedEvents.length - 1][1] + minDur * 0.3) {
                            mergedEvents.push(evt);
                        } else {
                            mergedEvents[mergedEvents.length - 1][1] = Math.max(
                                mergedEvents[mergedEvents.length - 1][1],
                                evt[1]
                            );
                        }
                    }
                    
                    // 過濾太短的事件
                    events = mergedEvents.filter(evt => evt[1] - evt[0] >= minDur);
                    
                    // 儲存到檔案儲存
                    if (currentFile && fileStore[currentFile]) {
                        fileStore[currentFile].events = events;
                    }
                    
                    // 更新UI
                    renderEvents();
                    drawWaveform(audioData, sampleRate);
                    updateStats();
                    updateFileTabs();
                    
                    fileEventCount.textContent = events.length > 0 ? `(${events.length} 個事件)` : '';
                    
                    statusText.textContent = `✅ 檢測完成！找到 ${events.length} 個事件 (靈敏度: ${thresholdMultiplier}, 最短: ${minDur}秒)`;
                    statusText.className = 'status-text success';
                    eventCount.textContent = `(${events.length})`;
                    exportSection.style.display = events.length > 0 ? 'block' : 'none';
                    statsGrid.style.display = events.length > 0 ? 'grid' : 'none';
                    
                    if (events.length === 0) {
                        statusText.textContent = '⚠️ 未檢測到事件，請嘗試更低靈敏度 (0.01-0.03)';
                        statusText.className = 'status-text warning';
                    }
                    
                } catch (error) {
                    console.error('檢測失敗:', error);
                    statusText.textContent = '❌ 檢測失敗: ' + error.message;
                    statusText.className = 'status-text danger';
                }
                
                loading.classList.remove('active');
            }, 100);
        }
        
        // ==================== 高解析度特徵提取 ====================
        function extractHighResFeatures(data, sr) {
            const frameLength = Math.floor(0.01 * sr); // 10ms frame
            const hopLength = Math.floor(0.002 * sr); // 2ms hop (超高解析度)
            const numFrames = Math.max(1, Math.floor((data.length - frameLength) / hopLength));
            
            const times = [];
            const energy = [];
            const spectral = [];
            const onset = [];
            const timbre = [];
            
            let prevFrame = null;
            
            for (let i = 0; i < numFrames; i++) {
                const start = i * hopLength;
                if (start + frameLength > data.length) break;
                const frame = data.slice(start, start + frameLength);
                const time = start / sr;
                times.push(time);
                
                // 1. 音量能量 (更精確)
                let sum = 0;
                let maxVal = 0;
                for (let j = 0; j < frame.length; j++) {
                    const v = frame[j] * frame[j];
                    sum += v;
                    if (Math.abs(frame[j]) > maxVal) maxVal = Math.abs(frame[j]);
                }
                energy.push(Math.sqrt(sum / frame.length) + maxVal * 0.1);
                
                // 2. 頻譜特徵 (更多頻帶)
                let spectralSum = 0;
                let weightSum = 0;
                for (let k = 0; k < 128 && k < frame.length; k++) {
                    const val = Math.abs(frame[k]);
                    spectralSum += val * k;
                    weightSum += val;
                }
                spectral.push(weightSum > 0 ? spectralSum / weightSum : 0);
                
                // 3. 節奏變化 (更敏感)
                if (prevFrame) {
                    let onsetVal = 0;
                    const len = Math.min(frame.length, prevFrame.length);
                    for (let j = 0; j < len; j++) {
                        const diff = frame[j] - prevFrame[j];
                        onsetVal += diff * diff;
                    }
                    onset.push(Math.sqrt(onsetVal / len));
                } else {
                    onset.push(0);
                }
                prevFrame = frame.slice();
                
                // 4. 音色特徵 (更精細)
                let geomMean = 0;
                let arithMean = 0;
                const n = Math.min(64, frame.length);
                for (let k = 0; k < n; k++) {
                    const val = Math.abs(frame[k]) + 0.0001;
                    geomMean += Math.log(val);
                    arithMean += val;
                }
                geomMean = Math.exp(geomMean / n);
                arithMean = arithMean / n;
                timbre.push(arithMean > 0 ? Math.min(1, geomMean / arithMean) : 0);
            }
            
            return { times, energy, spectral, onset, timbre };
        }
        
        // ==================== 基於特徵檢測 ====================
        function detectByFeature(feature, thresholdMultiplier, minDur, sr, times) {
            if (feature.length === 0) return [];
            
            const mean = feature.reduce((a, b) => a + b, 0) / feature.length;
            const std = Math.sqrt(feature.reduce((a, b) => a + (b - mean) * (b - mean), 0) / feature.length);
            const threshold = Math.max(mean + thresholdMultiplier * std, mean * 0.5);
            
            const detections = [];
            let inEvent = false;
            let startIdx = 0;
            
            for (let i = 0; i < feature.length; i++) {
                const isAbove = feature[i] > threshold;
                if (isAbove && !inEvent) {
                    inEvent = true;
                    startIdx = i;
                } else if (!isAbove && inEvent) {
                    inEvent = false;
                    const startTime = times[startIdx] || 0;
                    const endTime = times[Math.min(i - 1, times.length - 1)] || 0;
                    if (endTime - startTime >= minDur) {
                        detections.push([startTime, endTime]);
                    }
                }
            }
            
            if (inEvent) {
                const startTime = times[startIdx] || 0;
                const endTime = times[times.length - 1] || 0;
                if (endTime - startTime >= minDur) {
                    detections.push([startTime, endTime]);
                }
            }
            
            return detections;
        }
        
        // ==================== 標準檢測 ====================
        function detectEvents() {
            ultraSensitiveDetect();
        }
        
        // ==================== 繪製波形 ====================
        function drawWaveform(data, sr) {
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            const width = canvas.width = Math.max(400, rect.width - 30);
            const height = canvas.height = 200;
            
            ctx.clearRect(0, 0, width, height);
            
            // 背景
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.5, '#1a1a3e');
            gradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            if (data && data.length > 0) {
                const step = Math.max(1, Math.floor(data.length / width));
                const halfHeight = height / 2;
                
                ctx.beginPath();
                ctx.strokeStyle = '#00d4ff';
                ctx.lineWidth = 1.5;
                
                for (let i = 0; i < width; i++) {
                    const idx = Math.floor(i * step);
                    if (idx >= data.length) break;
                    const val = data[idx];
                    const y = halfHeight + val * halfHeight * 0.85;
                    
                    if (i === 0) {
                        ctx.moveTo(i, y);
                    } else {
                        ctx.lineTo(i, y);
                    }
                }
                ctx.stroke();
                
                // 填充
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 212, 255, 0.03)';
                ctx.fill();
            }
            
            // 事件標記
            const duration = audioBuffer ? audioBuffer.duration : (data ? data.length / sampleRate : 1);
            for (let i = 0; i < events.length; i++) {
                const [start, end] = events[i];
                const x1 = Math.max(0, (start / duration) * width);
                const x2 = Math.min(width, (end / duration) * width);
                
                const color = eventColors[i % eventColors.length];
                ctx.fillStyle = color + '15';
                ctx.fillRect(x1, 0, x2 - x1, height);
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash([2, 3]);
                ctx.strokeRect(x1, 0, x2 - x1, height);
                ctx.setLineDash([]);
                
                if (x2 - x1 > 20) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '9px Arial';
                    ctx.fillText(`#${i+1}`, x1 + 3, 14);
                }
            }
        }
        
        // ==================== 渲染事件列表 ====================
        function renderEvents() {
            eventList.innerHTML = '';
            
            if (events.length === 0) {
                eventList.innerHTML = `<div style="text-align:center; padding: 30px; color: #666; font-size: 14px;">🔍 未檢測到聲音事件</div>`;
                return;
            }
            
            events.forEach(([start, end], index) => {
                const duration = end - start;
                const color = eventColors[index % eventColors.length];
                
                const card = document.createElement('div');
                card.className = 'event-card';
                card.id = `event-${index}`;
                card.innerHTML = `
                    <div class="event-number">
                        <span class="color-tag" style="background: ${color}"></span>
                        事件 #${index + 1}
                    </div>
                    <div class="event-time">▶ 開始: ${start.toFixed(4)}秒</div>
                    <div class="event-time">◼ 結束: ${end.toFixed(4)}秒</div>
                    <div class="event-duration">⏱ 時長: ${duration.toFixed(4)}秒</div>
                    <div class="event-features">
                        <span class="feature-tag">🔊 音量變化</span>
                        <span class="feature-tag">🎵 頻率變化</span>
                        <span class="feature-tag">🎯 節奏變化</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="playEvent(${index})">▶ 播放</button>
                        <button class="btn btn-success" onclick="saveEvent(${index})">💾 儲存</button>
                        <button class="btn btn-info" onclick="viewSpectrum(${index})">📊 頻譜</button>
                    </div>
                `;
                eventList.appendChild(card);
            });
        }
        
        // ==================== 更新統計 ====================
        function updateStats() {
            if (events.length === 0) {
                statsGrid.style.display = 'none';
                return;
            }
            
            statsGrid.style.display = 'grid';
            
            document.getElementById('statEvents').textContent = events.length;
            
            const durations = events.map(e => e[1] - e[0]);
            const avgDur = durations.reduce((a, b) => a + b, 0) / durations.length;
            document.getElementById('statAvgDuration').textContent = avgDur.toFixed(4) + 's';
            
            const totalDuration = audioBuffer ? audioBuffer.duration : 1;
            const covered = durations.reduce((a, b) => a + b, 0);
            document.getElementById('statCoverage').textContent = ((covered / totalDuration) * 100).toFixed(2) + '%';
            
            document.getElementById('statMaxDuration').textContent = Math.max(...durations).toFixed(4) + 's';
            document.getElementById('statMinDuration').textContent = Math.min(...durations).toFixed(4) + 's';
        }
        
        // ==================== 播放功能 ====================
        function playEvent(index) {
            if (!audioData) return;
            
            const [start, end] = events[index];
            const offset = 0.1;
            const startSample = Math.max(0, Math.floor((start - offset) * sampleRate));
            const endSample = Math.min(audioData.length, Math.floor((end + offset) * sampleRate));
            const eventData = audioData.slice(startSample, endSample);
            
            const buffer = audioContext.createBuffer(1, eventData.length, sampleRate);
            buffer.copyToChannel(eventData, 0);
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start();
            
            currentEventIndex = index;
            playerTitle.textContent = `🎧 播放事件 ${index + 1} (${start.toFixed(4)}s - ${end.toFixed(4)}s)`;
            
            const duration = end - start + offset * 2;
            let startTime = audioContext.currentTime;
            
            const updateProgress = () => {
                if (audioContext.state === 'running') {
                    const elapsed = audioContext.currentTime - startTime;
                    const progress = Math.min(1, elapsed / duration);
                    playProgress.style.width = `${progress * 100}%`;
                    if (progress < 1) {
                        requestAnimationFrame(updateProgress);
                    } else {
                        playProgress.style.width = '0%';
                    }
                }
            };
            updateProgress();
            
            source.onended = () => {
                playProgress.style.width = '0%';
            };
            
            playerContainer.classList.add('active');
            
            document.querySelectorAll('.event-card').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(`event-${index}`);
            if (el) el.classList.add('active');
            
            statusText.textContent = `▶️ 播放事件 ${index + 1} (${start.toFixed(4)}s - ${end.toFixed(4)}s)`;
            statusText.className = 'status-text';
        }
        
        function playPrevious() {
            if (events.length === 0) return;
            const idx = currentEventIndex > 0 ? currentEventIndex - 1 : events.length - 1;
            playEvent(idx);
        }
        
        function playNext() {
            if (events.length === 0) return;
            const idx = currentEventIndex < events.length - 1 ? currentEventIndex + 1 : 0;
            playEvent(idx);
        }
        
        function playAllEvents() {
            if (events.length === 0 || allEventsPlaying) return;
            allEventsPlaying = true;
            let idx = 0;
            
            function playNextEvent() {
                if (idx >= events.length) {
                    allEventsPlaying = false;
                    return;
                }
                playEvent(idx);
                idx++;
                setTimeout(playNextEvent, 800);
            }
            playNextEvent();
        }
        
        function closePlayer() {
            playerContainer.classList.remove('active');
            if (audioContext && audioContext.state === 'running') {
                audioContext.suspend();
            }
            allEventsPlaying = false;
        }
        
        // ==================== 儲存事件 ====================
        function saveEvent(index) {
            if (!audioData) return;
            
            const [start, end] = events[index];
            const startSample = Math.floor(start * sampleRate);
            const endSample = Math.floor(end * sampleRate);
            const eventData = audioData.slice(startSample, endSample);
            
            const wav = audioBufferToWav(eventData, sampleRate);
            const blob = new Blob([wav], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            
            const fileName = currentFile ? currentFile.replace(/\.[^/.]+$/, '') : 'event';
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileName}_event_${String(index+1).padStart(3, '0')}_${start.toFixed(4)}s.wav`;
            a.click();
            URL.revokeObjectURL(url);
            
            statusText.textContent = `💾 事件 ${index+1} 已下載`;
            statusText.className = 'status-text success';
        }
        
        // ==================== 導出所有事件 ====================
        function exportAllEvents() {
            if (events.length === 0) {
                exportResult.textContent = '⚠️ 沒有事件可以導出';
                return;
            }
            
            const prefix = currentFile ? currentFile.replace(/\.[^/.]+$/, '') : 'event';
            let count = 0;
            
            events.forEach(([start, end], index) => {
                const startSample = Math.floor(start * sampleRate);
                const endSample = Math.floor(end * sampleRate);
                const eventData = audioData.slice(startSample, endSample);
                
                const wav = audioBufferToWav(eventData, sampleRate);
                const blob = new Blob([wav], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${prefix}_event_${String(index+1).padStart(3, '0')}_${start.toFixed(4)}s.wav`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                count++;
            });
            
            exportResult.textContent = `✅ 已導出 ${count} 個事件音頻 (${prefix})`;
            statusText.textContent = `✅ 已導出 ${count} 個事件`;
            statusText.className = 'status-text success';
        }
        
        // ==================== 導出時間線 ====================
        function exportTimeline() {
            if (events.length === 0) {
                exportResult.textContent = '⚠️ 沒有事件可以導出';
                return;
            }
            
            const prefix = currentFile ? currentFile.replace(/\.[^/.]+$/, '') : 'audio';
            let text = `🎵 音頻事件時間線 - ${currentFile || '未命名'}\n`;
            text += '='.repeat(60) + '\n';
            text += `靈敏度: ${sensitivity.value}\n`;
            text += `最短事件: ${minDuration.value}秒\n`;
            text += `事件總數: ${events.length}\n`;
            text += `總時長: ${(audioBuffer ? audioBuffer.duration : 0).toFixed(2)}秒\n\n`;
            text += '事件列表:\n';
            text += '-'.repeat(50) + '\n';
            
            events.forEach(([start, end], index) => {
                const duration = end - start;
                text += `#${String(index+1).padStart(4, ' ')}: ${start.toFixed(4)}s → ${end.toFixed(4)}s  (${duration.toFixed(4)}s)\n`;
            });
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${prefix}_timeline.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            exportResult.textContent = '✅ 時間線已下載';
        }
        
        // ==================== 導出報告 ====================
        function exportReport() {
            if (events.length === 0) {
                exportResult.textContent = '⚠️ 沒有事件可以導出';
                return;
            }
            
            const durations = events.map(e => e[1] - e[0]);
            const avgDur = durations.reduce((a, b) => a + b, 0) / durations.length;
            const totalDur = audioBuffer ? audioBuffer.duration : 1;
            const coverage = (durations.reduce((a, b) => a + b, 0) / totalDur * 100);
            const prefix = currentFile ? currentFile.replace(/\.[^/.]+$/, '') : 'audio';
            
            let text = `📊 音頻事件分析報告 - ${currentFile || '未命名'}\n`;
            text += '='.repeat(60) + '\n';
            text += `檢測時間: ${new Date().toLocaleString()}\n`;
            text += `靈敏度: ${sensitivity.value}\n`;
            text += `最短事件: ${minDuration.value}秒\n`;
            text += `總時長: ${totalDur.toFixed(2)}秒\n\n`;
            text += `📈 統計數據:\n`;
            text += `  事件總數: ${events.length}\n`;
            text += `  平均時長: ${avgDur.toFixed(4)}秒\n`;
            text += `  最長事件: ${Math.max(...durations).toFixed(4)}秒\n`;
            text += `  最短事件: ${Math.min(...durations).toFixed(4)}秒\n`;
            text += `  聲音覆蓋率: ${coverage.toFixed(2)}%\n\n`;
            text += `📋 詳細事件列表:\n`;
            text += '-'.repeat(50) + '\n';
            
            events.forEach(([start, end], index) => {
                const duration = end - start;
                text += `#${String(index+1).padStart(3, ' ')}: ${start.toFixed(4)}s → ${end.toFixed(4)}s  (${duration.toFixed(4)}s)\n`;
            });
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${prefix}_report.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            exportResult.textContent = '✅ 分析報告已下載';
        }
        
        // ==================== 導出所有檔案報告 ====================
        function exportAllFilesReport() {
            const fileNames = Object.keys(fileStore);
            if (fileNames.length === 0) {
                exportResult.textContent = '⚠️ 沒有檔案可以導出';
                return;
            }
            
            let text = `📊 所有檔案音頻分析報告\n`;
            text += '='.repeat(60) + '\n';
            text += `報告時間: ${new Date().toLocaleString()}\n`;
            text += `檔案總數: ${fileNames.length}\n\n`;
            
            fileNames.forEach(name => {
                const data = fileStore[name];
                const evts = data.events || [];
                const durations = evts.map(e => e[1] - e[0]);
                const totalDur = data.duration || 0;
                const coverage = durations.length > 0 ? (durations.reduce((a, b) => a + b, 0) / totalDur * 100) : 0;
                
                text += `📁 ${name}\n`;
                text += `  時長: ${totalDur.toFixed(2)}秒\n`;
                text += `  事件數: ${evts.length}\n`;
                text += `  覆蓋率: ${coverage.toFixed(2)}%\n`;
                if (evts.length > 0) {
                    text += `  平均時長: ${(durations.reduce((a, b) => a + b, 0) / durations.length).toFixed(4)}秒\n`;
                    text += `  最長事件: ${Math.max(...durations).toFixed(4)}秒\n`;
                }
                text += '\n';
            });
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all_files_report.txt';
            a.click();
            URL.revokeObjectURL(url);
            
            exportResult.textContent = '✅ 所有檔案報告已下載';
        }
        
        // ==================== 頻譜查看 ====================
        function viewSpectrum(index) {
            const [start, end] = events[index];
            const startSample = Math.floor(start * sampleRate);
            const endSample = Math.floor(end * sampleRate);
            const eventData = audioData.slice(startSample, endSample);
            
            const n_fft = 1024;
            const fft = [];
            for (let i = 0; i < n_fft / 2; i++) {
                let real = 0, imag = 0;
                for (let n = 0; n < n_fft && n < eventData.length; n++) {
                    const angle = -2 * Math.PI * i * n / n_fft;
                    const windowVal = 0.5 - 0.5 * Math.cos(2 * Math.PI * n / n_fft);
                    real += eventData[n] * windowVal * Math.cos(angle);
                    imag += eventData[n] * windowVal * Math.sin(angle);
                }
                fft.push(Math.sqrt(real * real + imag * imag));
            }
            
            const prefix = currentFile ? currentFile.replace(/\.[^/.]+$/, '') : 'event';
            const win = window.open('', '_blank', 'width=650,height=450');
            win.document.write(`
                <html><head><title>${prefix} 事件 ${index+1} 頻譜</title>
                <style>
                    body { font-family: Arial; padding: 20px; background: #0a0a1a; color: #e0e0e0; }
                    h3 { color: #00d4ff; }
                    .info { color: #888; font-size: 13px; margin: 10px 0; }
                    canvas { width: 100%; height: 300px; background: #0a0a1a; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
                    button { padding: 10px 25px; background: linear-gradient(135deg, #00d4ff, #7b2ffc); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
                    button:hover { transform: scale(1.05); }
                </style>
                </head><body>
                <h3>🎵 ${prefix} - 事件 ${index+1} 頻譜</h3>
                <div class="info">⏱ ${start.toFixed(4)}s - ${end.toFixed(4)}s | 時長: ${(end-start).toFixed(4)}s</div>
                <canvas id="spec"></canvas>
                <p style="color: #666; font-size: 11px;">頻率 (Hz) →</p>
                <button onclick="window.close()">關閉</button>
                <script>
                    const canvas = document.getElementById('spec');
                    const ctx = canvas.getContext('2d');
                    canvas.width = canvas.parentElement.clientWidth - 40;
                    canvas.height = 300;
                    
                    const data = ${JSON.stringify(fft)};
                    const maxVal = Math.max(...data, 0.001);
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#0a0a1a';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.beginPath();
                    ctx.strokeStyle = '#00d4ff';
                    ctx.lineWidth = 2;
                    
                    for (let i = 0; i < canvas.width; i++) {
                        const idx = Math.floor((i / canvas.width) * data.length);
                        if (idx >= data.length) break;
                        const val = data[idx] / maxVal;
                        const y = canvas.height - Math.max(0, val * canvas.height * 0.85);
                        
                        if (i === 0) { ctx.moveTo(i, y); }
                        else { ctx.lineTo(i, y); }
                    }
                    ctx.stroke();
                    
                    const maxIdx = data.indexOf(Math.max(...data));
                    const peakX = (maxIdx / data.length) * canvas.width;
                    const peakY = canvas.height - (data[maxIdx] / maxVal) * canvas.height * 0.85;
                    ctx.beginPath();
                    ctx.arc(peakX, peakY, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ff4081';
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '11px Arial';
                    ctx.fillText('峰值', peakX + 10, peakY);
                <\/script>
                </body></html>
            `);
        }
        
        // ==================== 清除當前檔案 ====================
        function clearCurrentFile() {
            if (currentFile && fileStore[currentFile]) {
                fileStore[currentFile].events = [];
                events = [];
                renderEvents();
                drawWaveform(audioData, sampleRate);
                updateStats();
                updateFileTabs();
                fileEventCount.textContent = '';
                statusText.textContent = `🗑️ 已清除 ${currentFile} 的事件`;
                statusText.className = 'status-text';
                exportSection.style.display = 'none';
                statsGrid.style.display = 'none';
            }
        }
        
        // ==================== 工具函數 ====================
        function audioBufferToWav(buffer, sr) {
            const numChannels = 1;
            const sampleRate = sr;
            const bitsPerSample = 16;
            
            const dataLength = buffer.length * numChannels * (bitsPerSample / 8);
            const headerLength = 44;
            const totalLength = headerLength + dataLength;
            
            const wav = new ArrayBuffer(totalLength);
            const view = new DataView(wav);
            
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalLength - 8, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitsPerSample / 8), true);
            view.setUint16(32, numChannels * (bitsPerSample / 8), true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);
            
            for (let i = 0; i < buffer.length; i++) {
                const sample = Math.max(-1, Math.min(1, buffer[i]));
                const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                view.setInt16(headerLength + i * 2, intSample, true);
            }
            
            return wav;
        }
        
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
        
        // ==================== 鍵盤快捷鍵 ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') { playPrevious(); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { playNext(); e.preventDefault(); }
            else if (e.key === 'Enter' && events.length > 0) { 
                playEvent(currentEventIndex >= 0 ? currentEventIndex : 0); 
                e.preventDefault();
            }
            else if (e.key === 'Escape') { closePlayer(); }
            else if (e.key === 'd' || e.key === 'D') { ultraSensitiveDetect(); }
        });
        
        // ==================== 響應式 ====================
        window.addEventListener('resize', function() {
            if (audioData) {
                drawWaveform(audioData, sampleRate);
            }
        });
        
        console.log('🔊 超極致靈敏音頻檢測器 v2.0 已載入');
        console.log('💡 靈敏度可低至 0.01，最短事件可達 0.001 秒');
        console.log('📁 支援多檔案同時載入與管理');
        console.log('⌨️ 快捷鍵: ← 上一個 | → 下一個 | Enter 播放 | Esc 關閉 | D 檢測');
    </script>
